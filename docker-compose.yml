version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devplatform}
      MYSQL_USER: ${MYSQL_USER:-apexuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apexpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-apexuser}:${MYSQL_PASSWORD:-apexpassword}@mysql:3306/${MYSQL_DATABASE:-devplatform}
      - SECRET_KEY=${SECRET_KEY:-corp-production-secret-key-super-secure-2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-production-secret-key-super-secure-2026}
      - CORS_ORIGINS=*
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
